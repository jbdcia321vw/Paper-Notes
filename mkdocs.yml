site_name: RecSys Paper Notes · 推荐系统论文精读库
site_description: RecSys Paper Notes 推荐系统与信息检索顶会顶刊论文精读库，覆盖 22 个会刊、16 大方向，按会刊/年份/主题分类，每篇 5 分钟读懂核心思想
site_url: https://jbdcia321vw.github.io/Paper-Notes/
repo_url: https://github.com/jbdcia321vw/Paper-Notes
repo_name: jbdcia321vw/Paper-Notes

theme:
  name: material
  custom_dir: overrides
  logo: assets/papernotes-logo-horizontal.svg
  favicon: assets/favicon.svg
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式

plugins:
  - search:
      lang:
        - zh
        - en
  - tags

hooks:
  - hooks/set_build_date.py
  - hooks/tags_order.py
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/search-page.js
  - javascripts/title-link.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - 🏠 首页总览: index.md
  - 🔬 按推荐细分类别 (16大类):
      - 全部推荐细分方向总览: topics/index.md
      - "🤝 协同过滤与双塔召回": topics/collaborative_filtering.md
      - "🕸️ 图神经网络与知识图谱推荐": topics/graph_rec.md
      - "🔄 自监督对比学习与交互去噪": topics/self_supervised_denoising.md
      - "⏱️ 序列与会话推荐": topics/sequential_rec.md
      - "✨ 生成式推荐与离散语义 ID": topics/generative_rec.md
      - "🧠 大语言模型推荐 (LLM4Rec)": topics/llm_rec.md
      - "🗣️ 对话推荐与智能体仿真": topics/agent_conversational_rec.md
      - "🧩 多模态推荐与内容理解": topics/multimodal_rec.md
      - "👥 社交与群组推荐": topics/social_group_rec.md
      - "❄️ 冷启动与长尾推荐": topics/cold_start_rec.md
      - "🌐 跨域与多场景推荐": topics/cross_domain_multi_scenario.md
      - "📍 时空轨迹与 POI 本地生活推荐": topics/poi_spatiotemporal_rec.md
      - "🎯 CTR/CVR 预估与特征交叉": topics/ctr_feature_interaction.md
      - "⚖️ 多任务学习与列表级重排": topics/multi_task_reranking.md
      - "🎮 强化学习与动态探索推荐": topics/rl_bandit_rec.md
      - "🛡️ 去偏公平、可信隐私与工业架构": topics/debias_fairness_industrial.md
  - 🗓️ 按会议年份浏览:
      - 全部年份总览: years/index.md
      - "2026 年": years/2026.md
      - "2025 年": years/2025.md
