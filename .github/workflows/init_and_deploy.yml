name: Build & Deploy RecSys Paper Notes

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      clean_legacy_papers:
        description: "是否迁移旧目录结构并删除示例笔记（仅首次初始化时勾选）"
        required: false
        default: "false"
      papers_csv:
        description: "可选：策展名单 CSV 路径（如 data/papers/SIGIR2026.csv，需配置 LLM_API_KEY Secret）"
        required: false
        default: ""
      limit:
        description: "每个 CSV 最多处理前 N 篇（0 表示全部）"
        required: false
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrate legacy structure (manual only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.clean_legacy_papers == 'true'
        run: python scripts/init_clean_recsys_repo.py

      - name: Generate notes from curated CSV (manual only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.papers_csv != ''
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
        run: |
          python scripts/generate_recsys_notes.py \
            --papers-csv "${{ github.event.inputs.papers_csv }}" \
            --limit "${{ github.event.inputs.limit }}" \
            --workers 2

      - name: Build indices & mkdocs.yml
        run: python scripts/build_nav_and_index.py

      - name: Commit generated notes & indices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore(recsys): update notes and navigation"
          git push

      - name: Deploy MkDocs to GitHub Pages
        run: mkdocs gh-deploy --force
