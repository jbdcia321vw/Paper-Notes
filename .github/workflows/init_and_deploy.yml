name: Initialize RecSys Repo & Deploy MkDocs

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      clean_legacy_papers:
        description: "是否清空原仓库 2.3 万篇 CV/NLP 论文并初始化推荐系统目录"
        required: false
        default: "true"
      arxiv_query:
        description: "可选：自动从 arXiv 抓取并生成推荐论文解读的关键词（需配置 LLM_API_KEY Secret）"
        required: false
        default: ""
      target_venue:
        description: "目标归档会议/期刊目录（如 SIGIR2026, RecSys2026, TOIS2026）"
        required: false
        default: "SIGIR2026"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install mkdocs-material pypdf

      - name: Clean legacy CV/NLP papers & scaffold RecSys directories
        if: github.event.inputs.clean_legacy_papers == 'true' || !cancelled()
        run: |
          python scripts/init_clean_recsys_repo.py

      - name: Optional - Fetch & generate new RecSys paper notes via LLM
        if: github.event.inputs.arxiv_query != ''
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
        run: |
          python scripts/generate_recsys_notes.py \
            --venue "${{ github.event.inputs.target_venue }}" \
            --arxiv-query "${{ github.event.inputs.arxiv_query }}" \
            --max-papers 5

      - name: Build dual-dimension indices & mkdocs.yml
        run: |
          python scripts/build_nav_and_index.py

      - name: Commit updated notes & clean structure back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore(recsys): update RecSys paper notes and dual-axis navigation"
          git push

      - name: Deploy MkDocs to GitHub Pages
        run: |
          mkdocs gh-deploy --force
